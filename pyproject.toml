[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-fix"
version = "0.1.0"
description = "Worktree-based repository repair tools"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2,<3", "filelock>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "tracing", "workspace", "sandbox"]
include = ["config.py"]

[tool.hatch.build.targets.wheel.force-include]
"config.py" = "config.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["agent", "tools", "tracing", "workspace", "sandbox", "config.py", "main.py", "scripts"]
